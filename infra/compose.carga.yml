# Sobreposição dos cenários de carga, sobre infra/compose.yml: "justiça entre escolas" (Tech Spec do F0, seção 7c) e
# "login às 7h30" (Tech Spec da identidade, seção 7c, tarefa 16.0):
#
#   npm run carga
#   npm run carga:login
#
# As duas APIs com `cpus: 1` são a CPU de referência do login: o argon2 de infra/carga.env é calibrado nelas.
#
# Fixa a CPU de cada serviço, para o resultado não depender de quantos núcleos a máquina tem livres, e o número
# de threads do sandbox de CPU de cada worker coerente com ela: uma thread por núcleo inteiro, e pelo menos meio
# núcleo sobrando para o event loop renovar lock e vaga e gravar estado. Assim o lote, que tem container e CPU
# próprios, não rouba CPU do interativo, e o job sintético queima CPU sem travar o worker.
#
# A soma passa dos núcleos de uma máquina comum, e tudo bem: `cpus:` é teto, não reserva, e no pico do cenário
# só os workers interativos chegam perto do deles. Mudar um número aqui muda o que o cenário mede: rode o
# controle negativo de novo (`npm run carga:controle-negativo`).

x-worker-interativo-carga: &worker-interativo-carga
  # Cinco vagas interativas por escola e jobs de 100 ms: duas threads por réplica, quatro no total, esvaziam a
  # rajada de 500 da escola A em uns 15 s, abaixo dos 30 s do alerta.
  cpus: 2.5
  environment:
    WORKER_THREADS_MAXIMO: '2'

x-worker-lote-carga: &worker-lote-carga
  cpus: 1.5
  environment:
    WORKER_THREADS_MAXIMO: '1'

services:
  postgres:
    cpus: 2
    # O `pg_stat_statements` carregado: a fase do expurgo (F3, tarefa 19.0) mede o tempo de cada statement do lote, da
    # troca de nome e da B, e reprova o que passa dos 2 s do `statement_timeout`. O `max_connections` é o de
    # infra/compose.yml. O `timezone=` dele **não** vem: o cenário de carga continua no UTC do contêiner. O único
    # `current_date` do cenário é o `chegou_em` da semente do expurgo (`infra/scripts/expurgo-da-carga.ts`), que só
    # precisa ser coerente com o `check` do banco na mesma sessão.
    command: [postgres, -c, 'max_connections=${POSTGRES_CONEXOES_MAXIMAS:?defina POSTGRES_CONEXOES_MAXIMAS}', -c, shared_preload_libraries=pg_stat_statements, -c, pg_stat_statements.track=all]
  redis-fila:
    cpus: 0.5
  redis-cache:
    cpus: 0.5
  storage:
    cpus: 0.25
  # No cenário da sala, uma fração dos alunos prova a conta da escola aqui (acesso-e-convites, 16.0): cada um, um sujeito próprio
  # (`google-aluna-carga-.*`, de `infra/oidc-falso/config.json`). O teto o impede de disputar CPU com as APIs.
  oidc-falso:
    cpus: 0.5
  # O cenário não manda e-mail: o Mailpit só existe porque o compose o tem, e o teto o impede de disputar CPU com as APIs.
  mailpit:
    cpus: 0.25
  migrar:
    cpus: 0.5
  api-1:
    cpus: 1
  api-2:
    cpus: 1
  realtime-1:
    cpus: 0.25
  realtime-2:
    cpus: 0.25
  despachante-1:
    cpus: 0.5
  despachante-2:
    cpus: 0.5
  worker-interativo-1: *worker-interativo-carga
  worker-interativo-2: *worker-interativo-carga
  worker-lote-1: *worker-lote-carga
  worker-lote-2: *worker-lote-carga
  borda:
    cpus: 0.5
  observabilidade:
    cpus: 0.5
  web:
    cpus: 0.5

  # O gerador de carga, na mesma rede: todos os VUs saem do IP deste container, como uma escola inteira atrás
  # de um NAT. Só sobe por `docker compose run` (perfil próprio), chamado por infra/scripts/carga.ts.
  k6:
    image: grafana/k6:2.2.0
    profiles: [carga]
    cpus: 1.5
    environment:
      # Nada sai da máquina: sem o relatório anônimo de uso que o k6 manda por padrão.
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ./k6:/cenario:ro
      # Tokens sintéticos de entrada e resumo de saída, numa pasta temporária que o script apaga no fim.
      - ${CARGA_PASTA_DA_EXECUCAO:?rode pelo npm run carga}:/execucao
    restart: 'no'

  # O segundo gerador do cenário "login às 7h30" (tarefa 16.0): o ataque "de fora", de um container com IP próprio, ao
  # mesmo tempo que o k6 da escola. Mesmo script, `FASE=atacante`, chamado por infra/scripts/carga-login.ts. No cenário
  # "reivindicação em sala" (A1, tarefa 9.0), é a outra escola entrando por login, de outra rede, enquanto a turma
  # reivindica (`FASE=outra_escola`, chamado por infra/scripts/carga-sala.ts).
  k6-atacante:
    image: grafana/k6:2.2.0
    profiles: [carga]
    cpus: 1
    environment:
      K6_NO_USAGE_REPORT: 'true'
    volumes:
      - ./k6:/cenario:ro
      - ${CARGA_PASTA_DA_EXECUCAO:?rode pelo npm run carga}:/execucao
    restart: 'no'
