# Alerta "Provedor de IA fora" (reengenharia-continuacao, tarefa 10.0; runbook: docs/runbook.md#provedor-de-ia-fora).
# Provisionado por arquivo no Grafana da observabilidade local (infra/compose.yml monta esta pasta em provisioning/alerting).
#
# `ia.disjuntor.aberto{provedor,modelo,perfil}` vale 1 enquanto o disjuntor daquele modelo e perfil não está fechado (cinco falhas seguidas do provedor: 5xx, conexão
# recusada ou prazo estourado; meio aberto também conta, para o alerta não oscilar a cada chamada de teste de 30 s). O disjuntor é em memória, por réplica, de
# propósito: é a saúde local do provedor. Por isso a regra toma o maior valor por provedor, modelo e perfil entre as réplicas. Aberto por 2 min seguidos é provedor
# fora de verdade, e não um tropeço. A série não leva escola, execução nem usuário.
#
# Sem série (nenhuma chamada ainda, ou o worker de IA parado) o estado é normal: o worker parado tem o alerta dele (a fila). Fechado o disjuntor, o alerta se resolve sozinho.
apiVersion: 1

groups:
  - orgId: 1
    name: ia-provedor-fora
    folder: Educa.ia alertas
    interval: 10s
    rules:
      - uid: educa-ia-provedor-fora
        title: Provedor de IA fora
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          area: ia
        annotations:
          summary: 'O provedor {{ $labels.provedor }} está fora para o modelo {{ $labels.modelo }} (perfil {{ $labels.perfil }}): o disjuntor está aberto há 2 min'
          description: O gateway de IA parou de chamar o modelo depois de cinco falhas seguidas. Quem pede ao modelo recebe Tentar de novo, e nada de cru. Siga o runbook.
          runbook_url: https://github.com/Turmma/turmma/blob/main/docs/runbook.md#provedor-de-ia-fora
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'max by (provedor, modelo, perfil) (ia_disjuntor_aberto)'
              instant: true
              range: false
              intervalMs: 10000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [0]
