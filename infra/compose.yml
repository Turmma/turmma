# Ambiente local completo. Sobe com `docker compose up` na raiz do repositório.
# Toda variável vem de `.env.example` e é obrigatória (`:?`): se faltar, o compose falha
# em vez de subir com valor escondido que só existe numa máquina.
name: educa

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    # `timezone` na linha de comando, e não pelo `TZ` do contêiner: o `initdb` grava o fuso no `postgresql.conf` do volume na
    # primeira subida, e mudar o ambiente depois não o mexe. Sem isto, toda sessão (a API, o worker, as fábricas do e2e, o
    # `psql`) lê o `current_date` em UTC, que entre 21 h e meia-noite em São Paulo já é o dia seguinte.
    command: [postgres, -c, 'max_connections=${POSTGRES_CONEXOES_MAXIMAS:?defina POSTGRES_CONEXOES_MAXIMAS}', -c, 'timezone=${POSTGRES_FUSO:?defina POSTGRES_FUSO}']
    environment:
      POSTGRES_USER: ${POSTGRES_USUARIO:?defina POSTGRES_USUARIO}
      POSTGRES_PASSWORD: ${POSTGRES_SENHA:?defina POSTGRES_SENHA}
      POSTGRES_DB: ${POSTGRES_BANCO:?defina POSTGRES_BANCO}
    ports:
      - 127.0.0.1:${POSTGRES_PORTA_HOST:?defina POSTGRES_PORTA_HOST}:5432
    volumes:
      - postgres-dados:/var/lib/postgresql
    healthcheck:
      # -h força TCP: pelo socket, o servidor temporário da inicialização responderia antes da hora.
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-fila:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_FILA_MEMORIA_MAXIMA:?defina REDIS_FILA_MEMORIA_MAXIMA}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    ports:
      - 127.0.0.1:${REDIS_FILA_PORTA_HOST:?defina REDIS_FILA_PORTA_HOST}:6379
    volumes:
      - redis-fila-dados:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-cache:
    image: redis:8.8.2-alpine
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_CACHE_MEMORIA_MAXIMA:?defina REDIS_CACHE_MEMORIA_MAXIMA}
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - 'no'
      - --save
      - ''
    ports:
      - 127.0.0.1:${REDIS_CACHE_PORTA_HOST:?defina REDIS_CACHE_PORTA_HOST}:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    # MinIO deixou de publicar imagem comunitária; SeaweedFS atende pela API S3 (Tech Spec, seção 12).
    image: chrislusf/seaweedfs:4.46
    command:
      - mini
      - -dir=/data
      - -bucket=${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      - -admin.ui=false
      - -webdav=false
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
    ports:
      - 127.0.0.1:${STORAGE_PORTA_HOST:?defina STORAGE_PORTA_HOST}:8333
    volumes:
      - storage-dados:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Provedor OIDC falso (mock-oauth2-server, MIT) no lugar do Google e da Microsoft (tarefa 13.0): o login pela conta da
  # escola roda inteiro sem conta em serviço externo (regra 00, item 8). Um emissor `google` e um `microsoft`, com
  # usuários sintéticos fixos em infra/oidc-falso/config.json, escolhidos pelo nome digitado no formulário de login dele
  # (`subject`). Nada aqui é conta de verdade. JVM com teto de heap: fica abaixo de 100 MB de memória.
  oidc-falso:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2@sha256:b538810afd589d42fbfb856c588c2065eaeed1dc528d6c532972048e67fc2aff
    environment:
      JSON_CONFIG_PATH: /config/config.json
      SERVER_PORT: '8080'
      JAVA_TOOL_OPTIONS: -Xmx96m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
    volumes:
      - ./oidc-falso/config.json:/config/config.json:ro
    ports:
      - 127.0.0.1:${OIDC_FALSO_PORTA_HOST:?defina OIDC_FALSO_PORTA_HOST}:8080
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/google/.well-known/openid-configuration]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Aplica as migrations e sai. Roda antes de toda instância que usa o banco, só expande, e desiste do
  # lock em 5 s, com 3 tentativas (packages/core/src/db/migrate.ts). Mesma imagem da API.
  migrar:
    image: educa-api:local
    build:
      context: ..
      dockerfile: infra/docker/servico.Dockerfile
      target: api
    command: [node, dist/ops/migrar.js]
    environment:
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      MIGRAR_TIMEOUT_CONSULTA_MS: ${MIGRAR_TIMEOUT_CONSULTA_MS:?defina MIGRAR_TIMEOUT_CONSULTA_MS}
    # Uma conexão só, fora de pool: cabe na folga para operação do teste de max_connections.
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # Duas APIs atrás da borda. Nenhuma guarda estado que a outra precise (regra 80, item 5), e a
  # soma dos pools das duas cabe no `max_connections` do Postgres (teste em tools/ci/compose.int.test.ts).
  api-1: &api
    # Imagem com nome fixo: as duas réplicas usam a mesma, construída uma vez só.
    image: educa-api:local
    build:
      context: ..
      dockerfile: infra/docker/servico.Dockerfile
      target: api
    # Nome que não resolve (serviço fora do ar) falha em 1 s, e não nos 5 s padrão, segurando menos uma
    # thread do libuv (UV_THREADPOOL_SIZE). No musl da imagem alpine, `timeout` é o prazo total e `attempts`
    # só reenvia dentro dele; em imagem glibc `attempts` multiplica o prazo (docs/infra.md, "Threads e DNS").
    dns_opt: ['timeout:1', 'attempts:2']
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:?defina UV_THREADPOOL_SIZE}
      API_PORTA: '3000'
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${BANCO_POOL_MAXIMO:?defina BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      IDENTIDADE_CHAVE_ASSINATURA: ${IDENTIDADE_CHAVE_ASSINATURA:?defina IDENTIDADE_CHAVE_ASSINATURA}
      LOGIN_ARGON2_MEMORIA_KIB: ${LOGIN_ARGON2_MEMORIA_KIB:?defina LOGIN_ARGON2_MEMORIA_KIB}
      LOGIN_ARGON2_ITERACOES: ${LOGIN_ARGON2_ITERACOES:?defina LOGIN_ARGON2_ITERACOES}
      # Teto do semáforo do hash, conferido no boot contra o UV_THREADPOOL_SIZE acima.
      LOGIN_HASH_CONCORRENCIA: ${LOGIN_HASH_CONCORRENCIA:?defina LOGIN_HASH_CONCORRENCIA}
      # Só o controle negativo do cenário de login (16.0) põe true; a API recusa true em produção.
      LOGIN_PROTECAO_DESLIGADA: ${LOGIN_PROTECAO_DESLIGADA:?defina LOGIN_PROTECAO_DESLIGADA}
      # Tentativas por minuto de um IP no login por e-mail antes de rebaixar (15.0); nunca recusa.
      LIMITE_LOGIN_EMAIL_IP_MIN: ${LIMITE_LOGIN_EMAIL_IP_MIN:?defina LIMITE_LOGIN_EMAIL_IP_MIN}
      # Prazo por comando do cliente Redis do login. A API recusa acima de 100 ms em produção e no staging.
      LOGIN_REDIS_PRAZO_MS: ${LOGIN_REDIS_PRAZO_MS:?defina LOGIN_REDIS_PRAZO_MS}
      LOGIN_CHAVE_CONTADOR: ${LOGIN_CHAVE_CONTADOR:?defina LOGIN_CHAVE_CONTADOR}
      LOGIN_CHAVE_DISPOSITIVO_VERSAO: ${LOGIN_CHAVE_DISPOSITIVO_VERSAO:?defina LOGIN_CHAVE_DISPOSITIVO_VERSAO}
      LOGIN_CHAVE_DISPOSITIVO_V1: ${LOGIN_CHAVE_DISPOSITIVO_V1:?defina LOGIN_CHAVE_DISPOSITIVO_V1}
      IDENTIDADE_CHAVE_CIFRA_VERSAO: ${IDENTIDADE_CHAVE_CIFRA_VERSAO:?defina IDENTIDADE_CHAVE_CIFRA_VERSAO}
      IDENTIDADE_CHAVE_CIFRA_V1: ${IDENTIDADE_CHAVE_CIFRA_V1:?defina IDENTIDADE_CHAVE_CIFRA_V1}
      IDENTIDADE_CHAVE_RECUPERACAO: ${IDENTIDADE_CHAVE_RECUPERACAO:?defina IDENTIDADE_CHAVE_RECUPERACAO}
      SALA_CHAVE_CODIGO: ${SALA_CHAVE_CODIGO:?defina SALA_CHAVE_CODIGO}
      # Login pela conta da escola contra o oidc-falso. Sem depends_on: fora do ar, só esse botão falha, com
      # `?falha=provedor`, e a matrícula e o e-mail seguem (regra 80, item 4).
      LOGIN_EXTERNO_RETORNO_URL: ${LOGIN_EXTERNO_RETORNO_URL:?defina LOGIN_EXTERNO_RETORNO_URL}
      LOGIN_EXTERNO_CHAVE_COOKIE: ${LOGIN_EXTERNO_CHAVE_COOKIE:?defina LOGIN_EXTERNO_CHAVE_COOKIE}
      LOGIN_EXTERNO_GOOGLE_EMISSOR: ${LOGIN_EXTERNO_GOOGLE_EMISSOR:?defina LOGIN_EXTERNO_GOOGLE_EMISSOR}
      LOGIN_EXTERNO_GOOGLE_CLIENTE: ${LOGIN_EXTERNO_GOOGLE_CLIENTE:?defina LOGIN_EXTERNO_GOOGLE_CLIENTE}
      LOGIN_EXTERNO_GOOGLE_SEGREDO: ${LOGIN_EXTERNO_GOOGLE_SEGREDO:?defina LOGIN_EXTERNO_GOOGLE_SEGREDO}
      LOGIN_EXTERNO_MICROSOFT_EMISSOR: ${LOGIN_EXTERNO_MICROSOFT_EMISSOR:?defina LOGIN_EXTERNO_MICROSOFT_EMISSOR}
      LOGIN_EXTERNO_MICROSOFT_CLIENTE: ${LOGIN_EXTERNO_MICROSOFT_CLIENTE:?defina LOGIN_EXTERNO_MICROSOFT_CLIENTE}
      LOGIN_EXTERNO_MICROSOFT_SEGREDO: ${LOGIN_EXTERNO_MICROSOFT_SEGREDO:?defina LOGIN_EXTERNO_MICROSOFT_SEGREDO}
      DRENAGEM_ESPERA_BORDA_MS: ${DRENAGEM_ESPERA_BORDA_MS:?defina DRENAGEM_ESPERA_BORDA_MS}
      DRENAGEM_PRAZO_MS: ${DRENAGEM_PRAZO_MS:?defina DRENAGEM_PRAZO_MS}
      # Sem depends_on do Redis de cache: a API sobe e atende sem ele, limitando em memória.
      REDIS_CACHE_URL: redis://redis-cache:6379
      # Nem depends_on do Redis de fila: ele guarda o contador de uso por escola, que a API marca sem esperar
      # resposta, e o contador de tentativas de login, que fora do ar passa a contar em memória. Nos dois casos
      # perde-se a contagem compartilhada, não a requisição.
      REDIS_FILA_URL: redis://redis-fila:6379
      LIMITE_REQ_USUARIO_MIN: ${LIMITE_REQ_USUARIO_MIN:?defina LIMITE_REQ_USUARIO_MIN}
      LIMITE_REQ_ESCOLA_MIN: ${LIMITE_REQ_ESCOLA_MIN:?defina LIMITE_REQ_ESCOLA_MIN}
      LIMITE_REQ_IP_ANONIMO_MIN: ${LIMITE_REQ_IP_ANONIMO_MIN:?defina LIMITE_REQ_IP_ANONIMO_MIN}
      LIMITE_REQ_OPERADOR_MIN: ${LIMITE_REQ_OPERADOR_MIN:?defina LIMITE_REQ_OPERADOR_MIN}
      LIMITE_INSTANCIAS_API: ${LIMITE_INSTANCIAS_API:?defina LIMITE_INSTANCIAS_API}
      LIMITE_PROXIES_CONFIAVEIS: ${LIMITE_PROXIES_CONFIAVEIS:?defina LIMITE_PROXIES_CONFIAVEIS}
      ROTAS_SINTETICAS: ${ROTAS_SINTETICAS:?defina ROTAS_SINTETICAS}
      VERSAO: ${VERSAO:?defina VERSAO}
      AVISOS_SISTEMA: ${AVISOS_SISTEMA:?defina AVISOS_SISTEMA}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
      # Camada de IA (regra 30): adaptador falso por padrão. Com IA_ADAPTADOR=openai_compat a API fala com o servidor de
      # LLM_BASE_URL. De dentro do contêiner, 127.0.0.1 é o próprio contêiner: o modelo que roda na máquina se alcança
      # por host.docker.internal. Os modelos por perfil e a chave do provedor não têm valor no exemplo e não passam por aqui.
      IA_ADAPTADOR: ${IA_ADAPTADOR:?defina IA_ADAPTADOR}
      LLM_BASE_URL: ${LLM_BASE_URL:?defina LLM_BASE_URL}
      LLM_MODELO: ${LLM_MODELO:?defina LLM_MODELO}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:?defina LLM_TIMEOUT_MS}
      LLM_TIMEOUT_MS_RAPIDO: ${LLM_TIMEOUT_MS_RAPIDO:?defina LLM_TIMEOUT_MS_RAPIDO}
      LLM_TIMEOUT_MS_PADRAO: ${LLM_TIMEOUT_MS_PADRAO:?defina LLM_TIMEOUT_MS_PADRAO}
      LLM_RECUO_MS: ${LLM_RECUO_MS:?defina LLM_RECUO_MS}
      LLM_PROCESSAMENTO_LOCAL: ${LLM_PROCESSAMENTO_LOCAL:?defina LLM_PROCESSAMENTO_LOCAL}
      IA_PROVEDOR_ID: ${IA_PROVEDOR_ID:?defina IA_PROVEDOR_ID}
      IA_EXECUCOES_POR_ESCOLA: ${IA_EXECUCOES_POR_ESCOLA:?defina IA_EXECUCOES_POR_ESCOLA}
      IA_EXECUCOES_TOTAL: ${IA_EXECUCOES_TOTAL:?defina IA_EXECUCOES_TOTAL}
      IA_EXECUCAO_TIMEOUT_MS: ${IA_EXECUCAO_TIMEOUT_MS:?defina IA_EXECUCAO_TIMEOUT_MS}
      IA_LATENCIA_FALSA_MS: ${IA_LATENCIA_FALSA_MS:?defina IA_LATENCIA_FALSA_MS}
      # O arquivo do titular (F3, tarefa 13.0): a API confere que o objeto existe e assina a URL de download de 5 minutos.
      # `STORAGE_URL` é por onde ela alcança o storage; `STORAGE_URL_PUBLICA`, o endereço que entra na assinatura e que o
      # navegador abre (a assinatura cobre o host, e `storage:8333` não resolve fora do compose). Sem depends_on: com o
      # storage fora, baixar responde `INDISPONIVEL_TENTE_DE_NOVO`, e o resto da API segue.
      STORAGE_URL: http://storage:8333
      STORAGE_URL_PUBLICA: http://127.0.0.1:${STORAGE_PORTA_HOST:?defina STORAGE_PORTA_HOST}
      STORAGE_REGIAO: ${STORAGE_REGIAO:?defina STORAGE_REGIAO}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      STORAGE_CHAVE_ACESSO: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      STORAGE_CHAVE_SECRETA: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
    # Acima de DRENAGEM_PRAZO_MS: o Docker só manda SIGKILL depois de a drenagem ter tido o prazo inteiro.
    stop_grace_period: 15s
    ports:
      - 127.0.0.1:${API_1_PORTA_HOST:?defina API_1_PORTA_HOST}:3000
    depends_on:
      migrar:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/saude').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  api-2:
    <<: *api
    ports:
      - 127.0.0.1:${API_2_PORTA_HOST:?defina API_2_PORTA_HOST}:3000

  # Dois realtimes: a emissão atravessa as instâncias pelo stream do Redis de fila.
  realtime-1: &realtime
    image: educa-realtime:local
    build:
      context: ..
      dockerfile: infra/docker/servico.Dockerfile
      target: realtime
    dns_opt: ['timeout:1', 'attempts:2']
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:?defina UV_THREADPOOL_SIZE}
      REALTIME_PORTA: '3000'
      REDIS_FILA_URL: redis://redis-fila:6379
      REALTIME_STREAM_TAMANHO_MAXIMO: ${REALTIME_STREAM_TAMANHO_MAXIMO:?defina REALTIME_STREAM_TAMANHO_MAXIMO}
      # O handshake lê a sessão gravada, com a mesma consulta da API: sem Postgres, ninguém entra.
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${REALTIME_BANCO_POOL_MAXIMO:?defina REALTIME_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      IDENTIDADE_CHAVE_ASSINATURA: ${IDENTIDADE_CHAVE_ASSINATURA:?defina IDENTIDADE_CHAVE_ASSINATURA}
      DRENAGEM_ESPERA_BORDA_MS: ${DRENAGEM_ESPERA_BORDA_MS:?defina DRENAGEM_ESPERA_BORDA_MS}
      DRENAGEM_PRAZO_MS: ${DRENAGEM_PRAZO_MS:?defina DRENAGEM_PRAZO_MS}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    stop_grace_period: 15s
    ports:
      - 127.0.0.1:${REALTIME_1_PORTA_HOST:?defina REALTIME_1_PORTA_HOST}:3000
    depends_on:
      redis-fila:
        condition: service_healthy
      migrar:
        condition: service_completed_successfully
    healthcheck:
      # Sem `/saude` própria: a prontidão não consulta o Postgres nem o Redis. O handshake que não
      # alcançar o banco recusa com INDISPONIVEL_TENTE_DE_NOVO, e o cliente reconecta com recuo.
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/prontidao').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  realtime-2:
    <<: *realtime
    ports:
      - 127.0.0.1:${REALTIME_2_PORTA_HOST:?defina REALTIME_2_PORTA_HOST}:3000

  # Dois despachantes: levam o que está em job_registro ao Redis de fila. A reserva no banco
  # (FOR UPDATE SKIP LOCKED) e o jobId igual ao id da linha evitam publicar em dobro. A execução é
  # pelo menos uma vez (D49): o processador tolera reexecução pela chave de idempotência.
  despachante-1: &despachante
    image: educa-despachante:local
    build:
      context: ..
      dockerfile: infra/docker/servico.Dockerfile
      target: despachante
    dns_opt: ['timeout:1', 'attempts:2']
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:?defina UV_THREADPOOL_SIZE}
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      # A conexão do LISTEN sai deste pool.
      BANCO_POOL_MAXIMO: ${DESPACHANTE_BANCO_POOL_MAXIMO:?defina DESPACHANTE_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      REDIS_FILA_URL: redis://redis-fila:6379
      VAGAS_ESCOLA_INTERATIVA: ${VAGAS_ESCOLA_INTERATIVA:?defina VAGAS_ESCOLA_INTERATIVA}
      VAGAS_ESCOLA_NORMAL: ${VAGAS_ESCOLA_NORMAL:?defina VAGAS_ESCOLA_NORMAL}
      VAGAS_ESCOLA_LOTE: ${VAGAS_ESCOLA_LOTE:?defina VAGAS_ESCOLA_LOTE}
      # Só o controle negativo do cenário de carga liga (npm run carga:controle-negativo); não sobe em produção.
      VAGAS_POR_ESCOLA_DESLIGADAS: ${VAGAS_POR_ESCOLA_DESLIGADAS:?defina VAGAS_POR_ESCOLA_DESLIGADAS}
      JANELA_LETIVA_FUSO: ${JANELA_LETIVA_FUSO:?defina JANELA_LETIVA_FUSO}
      JANELA_LETIVA_DIAS: ${JANELA_LETIVA_DIAS:?defina JANELA_LETIVA_DIAS}
      JANELA_LETIVA_INICIO: ${JANELA_LETIVA_INICIO:?defina JANELA_LETIVA_INICIO}
      JANELA_LETIVA_FIM: ${JANELA_LETIVA_FIM:?defina JANELA_LETIVA_FIM}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    stop_grace_period: 15s
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis-fila:
        condition: service_healthy
    healthcheck:
      # Sem HTTP: o laço grava o batimento a cada rodada (packages/core/src/runtime/heartbeat.ts).
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/educa-batimento').mtimeMs<10000?0:1)}catch{process.exit(1)}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  despachante-2:
    <<: *despachante

  # Workers por prioridade, duas réplicas de cada, com pools separados: o worker-interativo atende as
  # filas interativa e normal, e o worker-lote só a de lote, então lote nenhum ocupa a vez de um
  # interativo. No SIGTERM, cada worker espera os jobs em andamento por até 20 s; morto no meio
  # (kill -9), o lock do job vence e a outra réplica o retoma pelo stalled do BullMQ.
  worker-interativo-1: &worker-interativo
    image: educa-worker:local
    build:
      context: ..
      dockerfile: infra/docker/servico.Dockerfile
      target: worker
    dns_opt: ['timeout:1', 'attempts:2']
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:?defina UV_THREADPOOL_SIZE}
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${WORKER_INTERATIVO_BANCO_POOL_MAXIMO:?defina WORKER_INTERATIVO_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      REDIS_FILA_URL: redis://redis-fila:6379
      FILAS: interativa,normal
      WORKER_POOL_INTERATIVA: ${WORKER_POOL_INTERATIVA:?defina WORKER_POOL_INTERATIVA}
      WORKER_POOL_NORMAL: ${WORKER_POOL_NORMAL:?defina WORKER_POOL_NORMAL}
      WORKER_THREADS_MAXIMO: ${WORKER_INTERATIVO_THREADS_MAXIMO:?defina WORKER_INTERATIVO_THREADS_MAXIMO}
      VAGAS_ESCOLA_INTERATIVA: ${VAGAS_ESCOLA_INTERATIVA:?defina VAGAS_ESCOLA_INTERATIVA}
      VAGAS_ESCOLA_NORMAL: ${VAGAS_ESCOLA_NORMAL:?defina VAGAS_ESCOLA_NORMAL}
      VAGAS_ESCOLA_LOTE: ${VAGAS_ESCOLA_LOTE:?defina VAGAS_ESCOLA_LOTE}
      VAGAS_POR_ESCOLA_DESLIGADAS: ${VAGAS_POR_ESCOLA_DESLIGADAS:?defina VAGAS_POR_ESCOLA_DESLIGADAS}
      # A fila normal monta o arquivo do titular (F3, tarefa 13.0) e o grava no storage. Sem depends_on: storage fora faz o job
      # tentar de novo, com o pedido `em_preparacao`, e só.
      STORAGE_URL: http://storage:8333
      STORAGE_REGIAO: ${STORAGE_REGIAO:?defina STORAGE_REGIAO}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      STORAGE_CHAVE_ACESSO: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      STORAGE_CHAVE_SECRETA: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}
    # Acima dos 20 s de graça do worker.close() (`GRACA_DO_DESLIGAMENTO_MS`, com a folga de `interromper()` e do fim do processo): o
    # Docker só manda SIGKILL depois dela. Um teste liga os dois (`apps/worker/src/desligamento.test.ts`).
    stop_grace_period: 25s
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis-fila:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "const fs=require('fs');try{process.exit(Date.now()-fs.statSync('/tmp/educa-batimento').mtimeMs<10000?0:1)}catch{process.exit(1)}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  worker-interativo-2:
    <<: *worker-interativo

  worker-lote-1: &worker-lote
    <<: *worker-interativo
    environment:
      AMBIENTE: ${AMBIENTE:?defina AMBIENTE}
      UV_THREADPOOL_SIZE: ${UV_THREADPOOL_SIZE:?defina UV_THREADPOOL_SIZE}
      BANCO_URL: postgres://${POSTGRES_USUARIO}:${POSTGRES_SENHA}@postgres:5432/${POSTGRES_BANCO}
      BANCO_POOL_MAXIMO: ${WORKER_LOTE_BANCO_POOL_MAXIMO:?defina WORKER_LOTE_BANCO_POOL_MAXIMO}
      BANCO_TIMEOUT_CONEXAO_MS: ${BANCO_TIMEOUT_CONEXAO_MS:?defina BANCO_TIMEOUT_CONEXAO_MS}
      BANCO_TIMEOUT_CONSULTA_MS: ${BANCO_TIMEOUT_CONSULTA_MS:?defina BANCO_TIMEOUT_CONSULTA_MS}
      REDIS_FILA_URL: redis://redis-fila:6379
      FILAS: lote
      WORKER_POOL_LOTE: ${WORKER_POOL_LOTE:?defina WORKER_POOL_LOTE}
      WORKER_THREADS_MAXIMO: ${WORKER_LOTE_THREADS_MAXIMO:?defina WORKER_LOTE_THREADS_MAXIMO}
      # Só o worker-lote, onde rodam as rotinas do sistema: a consolidação de uso lista o storage para
      # medir os bytes de cada escola. Sem depends_on: storage fora faz a rotina tentar de novo, e só.
      STORAGE_URL: http://storage:8333
      STORAGE_REGIAO: ${STORAGE_REGIAO:?defina STORAGE_REGIAO}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?defina STORAGE_BUCKET}
      STORAGE_CHAVE_ACESSO: ${STORAGE_CHAVE_ACESSO:?defina STORAGE_CHAVE_ACESSO}
      STORAGE_CHAVE_SECRETA: ${STORAGE_CHAVE_SECRETA:?defina STORAGE_CHAVE_SECRETA}
      # Só o worker-lote: o mesmo horário letivo padrão do despachante. O expurgo da escola confere a janela a cada lote
      # e para quando ela abre, e a rotina noturna tira do fuso da escola a data local da chave (F3, tarefa 3.0).
      JANELA_LETIVA_FUSO: ${JANELA_LETIVA_FUSO:?defina JANELA_LETIVA_FUSO}
      JANELA_LETIVA_DIAS: ${JANELA_LETIVA_DIAS:?defina JANELA_LETIVA_DIAS}
      JANELA_LETIVA_INICIO: ${JANELA_LETIVA_INICIO:?defina JANELA_LETIVA_INICIO}
      JANELA_LETIVA_FIM: ${JANELA_LETIVA_FIM:?defina JANELA_LETIVA_FIM}
      VAGAS_ESCOLA_INTERATIVA: ${VAGAS_ESCOLA_INTERATIVA:?defina VAGAS_ESCOLA_INTERATIVA}
      VAGAS_ESCOLA_NORMAL: ${VAGAS_ESCOLA_NORMAL:?defina VAGAS_ESCOLA_NORMAL}
      VAGAS_ESCOLA_LOTE: ${VAGAS_ESCOLA_LOTE:?defina VAGAS_ESCOLA_LOTE}
      VAGAS_POR_ESCOLA_DESLIGADAS: ${VAGAS_POR_ESCOLA_DESLIGADAS:?defina VAGAS_POR_ESCOLA_DESLIGADAS}
      # Métricas OTLP para a observabilidade local. Sem depends_on: fora do ar, perde-se a métrica, e só.
      TELEMETRIA_OTLP_URL: http://observabilidade:4318
      TELEMETRIA_INTERVALO_MS: ${TELEMETRIA_INTERVALO_MS:?defina TELEMETRIA_INTERVALO_MS}

  worker-lote-2:
    <<: *worker-lote

  # Borda local (infra/Caddyfile): balanceia as duas APIs e os dois realtimes, sem log de acesso.
  borda:
    image: caddy:2.11.4-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - 127.0.0.1:${BORDA_PORTA_HOST:?defina BORDA_PORTA_HOST}:8080
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy
      realtime-1:
        condition: service_healthy
      realtime-2:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  # Observabilidade local (Tech Spec, seção 5): coletor OTLP, Prometheus e Grafana numa imagem só, feita
  # para desenvolvimento e teste. API, realtime, despachante e worker exportam métrica para ela, e o painel
  # vem provisionado de infra/grafana/paineis/. Sem volume: a métrica local não tem retenção garantida.
  # Ninguém depende dela para subir.
  observabilidade:
    image: grafana/otel-lgtm:0.33.0
    # Nada sai da máquina (Tech Spec, seção 7). Por padrão a imagem manda estatística de uso do Grafana,
    # do Loki, do Tempo e do Pyroscope para a Grafana Labs, procura atualização, baixa plugins (inclusive um
    # de LLM) a cada subida e oferece publicar o painel em serviço público de snapshot. Tudo desligado aqui,
    # e o visitante anônimo só lê (infra/test/painel.test.ts exige cada uma destas linhas).
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      LOKI_EXTRA_ARGS: -reporting.enabled=false
      TEMPO_EXTRA_ARGS: -reporting.enabled=false
      PYROSCOPE_EXTRA_ARGS: -usage-stats.enabled=false
    ports:
      - 127.0.0.1:${GRAFANA_PORTA_HOST:?defina GRAFANA_PORTA_HOST}:3000
      - 127.0.0.1:${PROMETHEUS_PORTA_HOST:?defina PROMETHEUS_PORTA_HOST}:9090
    volumes:
      - ./grafana/provedor-de-paineis.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/educa.yaml:ro
      - ./grafana/paineis:/otel-lgtm/educa/paineis:ro
      # As regras de alerta (infra/grafana/alertas/, cada uma com entrada em docs/runbook.md) no lugar da pasta
      # de exemplo da imagem. Sem ponto de contato configurado nem SMTP: o alerta dispara no Grafana e não sai
      # da máquina; a entrega ao celular fica para o staging (D31).
      - ./grafana/alertas:/otel-lgtm/grafana/conf/provisioning/alerting:ro
    stop_grace_period: 10s
    healthcheck:
      # O coletor recebe, o Prometheus guarda e o Grafana mostra: pronto só com os três.
      test: [CMD-SHELL, 'curl -fsS -o /dev/null http://127.0.0.1:13133/ready && curl -fsS -o /dev/null http://127.0.0.1:9090/-/ready && curl -fsS -o /dev/null http://127.0.0.1:3000/api/health']
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 20s

  web:
    build:
      context: ..
      dockerfile: infra/docker/servico.Dockerfile
      target: web
      args:
        # Só "1" leva a galeria das peças para o build (o e2e roda nela). Staging e produção definem outro valor.
        VITE_COM_GALERIA: ${VITE_COM_GALERIA:?defina VITE_COM_GALERIA}
    environment:
      # A web chega à API pela borda, como o navegador chegará em staging.
      API_URL_INTERNA: http://borda:8080
    ports:
      - 127.0.0.1:${WEB_PORTA_HOST:?defina WEB_PORTA_HOST}:4173
    depends_on:
      borda:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4173/]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-dados:
  redis-fila-dados:
  storage-dados:
